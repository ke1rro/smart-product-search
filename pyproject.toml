[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-hm"
version = "0.1.0"
description = "UCU NLP Assignment 1: Build an NLP System"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "httpx2>=2.16.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "python-decouple==3.8",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mdformat==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "mdformat-gfm==1.0.0",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ty>=0.0.86",
]
notebooks = [
    "black[jupyter]==26.5.1",
    "ipykernel==7.3.0",
    "jupyterlab>=4,<5",
    "kaleido>=1.5.1",
    "plotly>=7.1.0",
]

[tool.uv]
required-version = ">=0.13.0"
python-preference = "only-managed"
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "scripts", "tests", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
